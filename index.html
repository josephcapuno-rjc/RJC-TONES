</head><body><style id="app-style">
/* Layout: slim header, full-width hero on the home page, then centered 1120px sections.
   Each pedal gets its own page; the pedal's color comes from --p0..--p7 and shows on its glyph and footswitch dot. */
:root {
  --font-display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --font-body: "Instrument Sans", ui-sans-serif, system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;

  --bg: #F4F5F7;
  --surface: #FFFFFF;
  --surface-2: #ECEFF3;
  --ink: #0E1621;
  --muted: #566070;
  --line: #DCE0E6;
  --focus: #2F5FD0;
  --danger: #B3261E;

  --hero-bg: #13213D;
  --hero-ink: #F4F6FA;
  --hero-muted: #B6C0D1;
  --amber: #FFB547;
  --screen: #0B0F14;

  --p0: #C0392B;
  --p1: #D2691E;
  --p2: #B8860B;
  --p3: #2E8B57;
  --p4: #0E7C86;
  --p5: #2F5FD0;
  --p6: #6D4AC4;
  --p7: #C2417A;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B0F14;
    --surface: #131921;
    --surface-2: #1A212B;
    --ink: #EAEEF3;
    --muted: #9AA5B4;
    --line: #262E39;
    --focus: #8FA8FF;
    --danger: #FF8A80;
    --hero-bg: #13213D;
    --p0: #F0786A;
    --p1: #F0A060;
    --p2: #E3B94A;
    --p3: #5CC48A;
    --p4: #4FC3CF;
    --p5: #7A9CF5;
    --p6: #A58BF0;
    --p7: #F07AAE;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B0F14;
  --surface: #131921;
  --surface-2: #1A212B;
  --ink: #EAEEF3;
  --muted: #9AA5B4;
  --line: #262E39;
  --focus: #8FA8FF;
  --danger: #FF8A80;
  --hero-bg: #13213D;
  --p0: #F0786A;
  --p1: #F0A060;
  --p2: #E3B94A;
  --p3: #5CC48A;
  --p4: #4FC3CF;
  --p5: #7A9CF5;
  --p6: #A58BF0;
  --p7: #F07AAE;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
}
a { color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.inner {
  max-width: 1120px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.inner[hidden] { display: none; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 42px;
  padding: 0 16px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  font: 600 14px var(--font-body);
  cursor: pointer;
  text-decoration: none;
  white-space: nowrap;
}
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.primary:hover { opacity: 0.88; }
.btn.amber { background: var(--amber); color: #1A1203; border-color: var(--amber); }
.btn.amber:hover { opacity: 0.9; }
.btn.ghost { background: transparent; color: var(--hero-ink); border-color: rgba(255, 255, 255, 0.4); }
.btn.ghost:hover { border-color: #fff; }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn.small { min-height: 34px; padding: 0 12px; font-size: 13px; }
.btn[aria-disabled="true"] { opacity: 0.55; cursor: default; pointer-events: none; }
.busy .btn, .busy .chip { opacity: 0.6; pointer-events: none; }

/* ---------- admin bar (editors only) ---------- */
.admin { background: var(--ink); color: var(--bg); }
.admin .inner { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-block: 8px; }
.admin-label { font: 600 12px var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; margin-right: 4px; }
.admin .btn { background: transparent; color: var(--bg); border-color: rgba(128, 128, 128, 0.7); }
.admin .btn:hover { border-color: var(--bg); }
.status { font-size: 13px; opacity: 0.9; min-width: 0; }
.status.bad { color: #FFB4AB; }
.admin-spacer { flex: 1 1 auto; }

/* ---------- header ---------- */
.site-head { background: var(--surface); border-bottom: 1px solid var(--line); }
.site-head .inner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 24px; padding-block: 12px; }
.brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font: 800 1.2rem var(--font-display); letter-spacing: -0.02em; min-height: 44px; }
.brand-dot { width: 16px; height: 16px; border-radius: 50%; background: var(--amber); box-shadow: inset 0 0 0 3px var(--surface), 0 0 0 2px var(--amber); flex: none; }
.nav { display: flex; flex-wrap: wrap; gap: 4px; }
.nav a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 8px; text-decoration: none; font: 500 15px var(--font-body); color: var(--muted); }
.nav a:hover { color: var(--ink); background: var(--surface-2); }
.nav a[aria-current="page"] { color: var(--ink); font-weight: 600; box-shadow: inset 0 -2px 0 var(--ink); border-radius: 0; }

/* ---------- editor panel ---------- */
.editor { margin-top: 20px; background: var(--surface); border: 1px solid var(--ink); border-radius: 10px; padding: 20px; }
.editor h2 { font: 700 1.125rem var(--font-display); margin: 0; }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.form .full { grid-column: 1 / -1; }

  function artFor(name, brand) {
    const t = (String(name || '') + ' ' + String(brand || '')).toLowerCase();
    if (/mg-?50\s*li/.test(t)) return ART.mg50li;
    if (/mg-?30\b/.test(t)) return ART.mg30;
    if (/gp-?200/.test(t)) return ART.gp200;
    if (/tank[\s-]?g/.test(t)) return ART.tankg;
    if (/gp-?5\b/.test(t)) return ART.gp5;
    if (/livtra\s*mosaic/.test(t)) return ART.mosaic;
    if (/hd\s*-?500/.test(t)) return ART.hd500x;

  }

  // ---------- helpers ----------
  const clean = (s, max) => String(s == null ? '' : s).trim().slice(0, max);
  const today = () => new Date().toISOString().slice(0, 10);
  const uid = () => 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
  function safeLink(s) {
    try { const u = new URL(String(s || '').trim()); return u.protocol === 'https:' ? u.href : ''; } catch (e) { return ''; }
  }
  function safeYouTube(s) {
    try { const u = new URL(String(s || '').trim()); return u.protocol === 'https:' && /^(www\.|m\.)?(youtube\.com|youtu\.be)$/i.test(u.hostname) ? u.href : ''; } catch (e) { return ''; }
  }
  const pedalKey = (n) => String(n || '').trim().toLowerCase().replace(/\s+/g, ' ');
  function hash36(s) {
    let x = 5381;

    return x;
  }
  const pedalColor = (key) => 'var(--p' + (hash36(key) % 8) + ')';
  function fmtDate(iso) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
    if (!m) return '';
    return new Date(+m[1], +m[2] - 1, +m[3]).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach((k) => {
        const v = attrs[k];
        if (v == null || v === false) return;
        if (k === 'class') el.className = v;
        else if (k === 'text') el.textContent = v;
        else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
        else el.setAttribute(k, v === true ? '' : v);
      });
    }
    kids.flat().forEach((c) => {
      if (c == null || c === false) return;
      el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return el;
  }
  const clear = (el) => { while (el.firstChild) el.removeChild(el.firstChild); };
  const withPc = (el, key) => { el.style.setProperty('--pc', pedalColor(key)); return el; };
  function glyph(colorVar, led, name, brand) {
    const s = h('span', { class: 'glyph', 'aria-hidden': 'true' });
    s.innerHTML = '<svg viewBox="0 0 200 150" focusable="false">' + artFor(name, brand)(String(led || '01').replace(/[^0-9A-Za-z]/g, '')) + '</svg>';
    s.style.setProperty('--pc', colorVar);
    return s;
  }
  function cap(name) {
    try {
      if (!window.claude || !window.claude.use) return Promise.resolve(null);
      return Promise.resolve(window.claude.use(name)).then((v) => v || null, () => null);
    } catch (e) { return Promise.resolve(null); }
  }

  const toTitle = (s) => { s = String(s || ''); return s === s.toUpperCase() && /[A-Z]/.test(s) ? s.toLowerCase().replace(/(^|[\s(\/-])([a-z])/g, (m, a, b) => a + b.toUpperCase()) : s; };
  function songParts(name) {

  }
  const artistOf = (p) => songParts(p.name).artist;

  function normPreset(p) {
    const o = {
      id: clean(p && p.id, 40) || uid(),
      name: clean(p && p.name, 120),

    if (p && p.sample) o.sample = true;
    return o;
  }
  function normPedal(p) {
    const o = {

      brand: clean(p && p.brand, 60),

    if (p && p.sample) o.sample = true;

    const seen = {};
    state = {

      pedals: (Array.isArray(raw.pedals) ? raw.pedals : []).map(normPedal).filter((p) => {

  const mk = (patch) => Object.assign({}, state, patch);

  function allPedals(st) {
    st = st || state;
    const map = new Map();
    st.pedals.forEach((p) => {
      const k = pedalKey(p.name);
      if (!map.has(k)) map.set(k, { key: k, name: p.name, brand: p.brand, about: p.about, folder: p.folder, sample: !!p.sample, profile: true, count: 0, latest: '' });
    });
    st.presets.forEach((p) => {
      const k = pedalKey(p.pedal);
      let e = map.get(k);
      if (!e) { e = { key: k, name: p.pedal, brand: '', about: '', folder: '', sample: false, profile: false, count: 0, latest: '' }; map.set(k, e); }
      e.count++;
      if (p.added > e.latest) e.latest = p.added;
    });
    const list = Array.from(map.values()).sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base', numeric: true }));
    const used = {};

      let base = 'pedal-' + (e.key.replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || hash36(e.key).toString(36));

  function setStatus(msg, bad) {
    elStatus.textContent = msg || '';
    elStatus.className = 'status' + (bad ? ' bad' : '');
  }
  function persist(next, okMsg, goHash) {
    if (ui.busy) return Promise.resolve(false);
    return cap('artifact').then((a) => {
      if (!a || typeof a.publish !== 'function') {
        setStatus('Saving is not available in this view. Open the page in claude.ai to edit.', true);
        return false;
      }
      ui.busy = true;
      root.classList.add('busy');
      setStatus('Saving…');
      if (goHash) { try { sessionStorage.setItem('jc-go', goHash); } catch (e) {} }
      return a.publish(buildDoc(next)).then(() => {
        state = next;
        ui.editor = null; ui.confirmId = null; ui.confirmPedal = false;
        setStatus(okMsg || 'Saved. The page is reloading.');
        renderAll();
        return true;
      }, (e) => {
        if (goHash) { try { sessionStorage.removeItem('jc-go'); } catch (x) {} }
        const code = e && e.code;
        if (code === 'conflict') setStatus('Someone saved before you. The page is reloading with their version.', true);
        else if (code === 'not_writer' || code === 'not_granted' || code === 'consent_required') {
          ui.canEdit = false; renderAll();
          setStatus('This view is read-only, so nothing was saved.', true);
        } else if (code === 'too_large') setStatus('The page is too large to save. Remove some presets first.', true);
        else if (code === 'rate_limited') setStatus('Too many saves in a row. Wait a moment, then try again.', true);
        else setStatus('Could not save. Check your connection and try again.', true);
        return false;
      }).then((ok) => { ui.busy = false; root.classList.remove('busy'); return ok; });
    });
  }

  // ---------- shell ----------
  const root = document.getElementById('root');
  const elStatus = h('span', { class: 'status', role: 'status', 'aria-live': 'polite' });
  const elAdmin = h('div', { class: 'admin', hidden: true });
  const elNav = h('nav', { class: 'nav', 'aria-label': 'Main' });
  const elEditor = h('section', { class: 'editor', 'aria-label': 'Editor' });
  const elEditorWrap = h('div', { class: 'inner', hidden: true }, elEditor);
  const elMain = h('main', { id: 'main' });
  const elFoot = h('footer', { class: 'site-foot' });
  let theme = '';
  try { theme = localStorage.getItem('jc-theme') || ''; } catch (e) {}
  const applyTheme = (t) => { if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); };
  const isDark = () => (theme ? theme === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches));
  const themeBtn = h('button', { type: 'button', class: 'iconbtn', 'aria-label': 'Switch light or dark mode' });
  const paintTheme = () => { themeBtn.textContent = isDark() ? '☀ Light' : '☾ Dark'; };
  themeBtn.addEventListener('click', () => { theme = isDark() ? 'light' : 'dark'; applyTheme(theme); try { localStorage.setItem('jc-theme', theme); } catch (e) {} paintTheme(); });
  applyTheme(theme); paintTheme();
  root.append(
    elAdmin,
    h('header', { class: 'site-head' }, h('div', { class: 'inner' },
      h('a', { class: 'brand', href: '#home' }, h('span', { class: 'brand-dot', 'aria-hidden': 'true' }), 'RJC TONES'),
      h('div', { class: 'head-right' }, elNav, themeBtn)
    )),
    elEditorWrap,
    elMain,
    elFoot
  );

  function renderNav() {
    clear(elNav);
    NAV.forEach(([key, label]) => {
      const active = route.name === key || (key === 'pedals' && route.name === 'pedal');
      elNav.appendChild(h('a', { href: '#' + key, 'aria-current': active ? 'page' : null, text: key === 'saved' && favs.size ? label + ' (' + favs.size + ')' : label }));
    });
  }
  function renderFoot() {
    clear(elFoot);
    elFoot.appendChild(h('div', { class: 'inner' },
      h('div', { class: 'foot-note' }, h('div', { text: '© ' + new Date().getFullYear() + ' RJC TONES. Free presets for church musicians and guitarists, hosted on Google Drive.' }), h('small', { text: 'Product, band and song names belong to their owners and are used for identification only. RJC TONES is not affiliated with them.' })),
      h('nav', { 'aria-label': 'Footer' }, NAV.map(([key, label]) => h('a', { href: '#' + key, text: label })))
    ));
  }

  // ---------- shared view pieces ----------
  function copyLink(text, btn) {
    const done = () => { btn.textContent = 'Copied'; setTimeout(() => { btn.textContent = 'Copy link'; }, 1600); };
    const fallback = () => {
      try {
        const t = h('textarea', { 'aria-hidden': 'true' });
        t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';
        document.body.appendChild(t); t.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(t);
        if (ok) done(); else btn.textContent = 'Copy failed';
      } catch (e) { btn.textContent = 'Copy failed'; }
    };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
  }

  function ytId(u) {
    try {
      const x = new URL(u), host = x.hostname.replace(/^(www\.|m\.)/, '');
      if (host === 'youtu.be') return x.pathname.slice(1).split('/')[0];
      const m = /^\/(shorts|embed|live)\/([\w-]+)/.exec(x.pathname);
      return m ? m[2] : (x.searchParams.get('v') || '');
    } catch (e) { return ''; }
  }
  function demoThumb(url) {
    if (!url) return null;
    const id = ytId(url).replace(/[^\w-]/g, '');

  function applySort(list, mode) {
    const l = list.slice();
    if (mode === 'name') l.sort(cmpName);
    else if (mode === 'category') l.sort((a, b) => (CATEGORIES.indexOf(a.category) - CATEGORIES.indexOf(b.category)) || cmpName(a, b));
    else if (mode === 'newest') return newestFirst(l);
    else l.sort((a, b) => cmpSlot(a, b) || cmpName(a, b));
    return l;
  }

    return h('datalist', { id: 'pedal-list' }, out);
  }
  const field = (label, hint, control, full) => h('label', { class: full ? 'full' : null }, h('span', null, label, hint ? h('span', { class: 'hint', text: ' ' + hint }) : null), control);
  const catSelect = (id) => h('select', { id }, CATEGORIES.map((c) => h('option', { value: c, text: c })));
  const actionsRow = (submitText) => h('div', { class: 'full form-actions' },
    h('button', { type: 'submit', class: 'btn primary', text: submitText }),
    h('button', { type: 'button', class: 'btn', text: 'Cancel', onclick: closeEditor }));

  function formPreset() {
    const existing = ui.editor.id === 'new' ? null : state.presets.find((p) => p.id === ui.editor.id) || null;
    const defaultPedal = route.name === 'pedal' && route.entry ? route.entry.name : '';
    const p = existing || { name: '', pedal: defaultPedal, slot: '', category: 'Clean', notes: '', link: '' };
    const inName = h('input', { id: 'f-name', type: 'text', maxlength: '120', autocomplete: 'off' });
    const inPedal = h('input', { id: 'f-pedal', type: 'text', list: 'pedal-list', maxlength: '60', autocomplete: 'off' });
    const inSlot = h('input', { id: 'f-slot', type: 'text', maxlength: '12', autocomplete: 'off', placeholder: '03A' });
    const inCat = catSelect('f-cat');
    const inLink = h('input', { id: 'f-link', type: 'text', inputmode: 'url', autocomplete: 'off', placeholder: 'https://drive.google.com/file/d/...' });
    const inNotes = h('textarea', { id: 'f-notes', rows: '3', maxlength: '400' });
    const inDemo = h('input', { id: 'f-demo', type: 'text', inputmode: 'url', autocomplete: 'off', placeholder: 'https://www.youtube.com/watch?v=...' });
    inName.value = p.name; inPedal.value = p.pedal; inSlot.value = p.slot; inCat.value = p.category; inLink.value = p.link; inNotes.value = p.notes; inDemo.value = p.demo || '';
    const err = h('p', { class: 'err', role: 'alert' });
    const form = h('form', { class: 'form', novalidate: true, onsubmit: (e) => {
      e.preventDefault();
      const name = clean(inName.value, 120), pedal = clean(inPedal.value, 60);
      const linkRaw = inLink.value.trim(), link = safeLink(linkRaw);
      if (!name) { err.textContent = 'Give the preset a name.'; inName.focus(); return; }
      if (!pedal) { err.textContent = 'Choose or type the pedal this preset is for.'; inPedal.focus(); return; }
      if (linkRaw && !link) { err.textContent = 'The Drive link must start with https://'; inLink.focus(); return; }
      const demoRaw = inDemo.value.trim();
      if (demoRaw && !safeYouTube(demoRaw)) { err.textContent = 'The demo link must be a YouTube link starting with https://'; inDemo.focus(); return; }
      const rec = normPreset({ id: existing ? existing.id : uid(), name, pedal: canonicalPedal(pedal), slot: inSlot.value, category: inCat.value, notes: inNotes.value, link, demo: demoRaw, added: existing ? existing.added : today() });
      const presets = existing ? state.presets.map((x) => (x.id === existing.id ? rec : x)) : [rec].concat(state.presets);
      persist(mk({ presets }), existing ? 'Preset updated. The page is reloading.' : 'Preset added. The page is reloading.');
    } },
      h('div', { class: 'full' }, h('h2', { text: existing ? 'Edit preset' : 'Add preset' })),
      field('Preset name', '', inName),
      field('Pedal', '(pick one or type a new pedal)', inPedal),
      field('Slot', '(bank and slot on the pedal)', inSlot),
      field('Sound type', '', inCat),
      field('Google Drive link', '(share the file with anyone who has the link)', inLink, true),
      field('YouTube demo', '(optional, a youtube.com or youtu.be link)', inDemo, true),
      field('Notes', '(optional)', inNotes, true),
      pedalOptions(),
      h('div', { class: 'full' }, err),
      actionsRow('Save preset'));
    setTimeout(() => { try { inName.focus(); } catch (e) {} }, 0);
    return form;
  }

  function formBulk() {
    const defaultPedal = route.name === 'pedal' && route.entry ? route.entry.name : '';
    const inPedal = h('input', { id: 'b-pedal', type: 'text', list: 'pedal-list', maxlength: '60', autocomplete: 'off' });
    const inCat = catSelect('b-cat');
    const inLines = h('textarea', { id: 'b-lines', rows: '8', placeholder: 'Ambient Pad Wash | https://drive.google.com/file/d/... | 02A\nSunday Clean Swell | https://drive.google.com/file/d/... | 01A' });
    inPedal.value = defaultPedal;
    const err = h('p', { class: 'err', role: 'alert' });
    const form = h('form', { class: 'form', novalidate: true, onsubmit: (e) => {
      e.preventDefault();
      const pedal = clean(inPedal.value, 60);
      if (!pedal) { err.textContent = 'Choose or type the pedal for this batch.'; inPedal.focus(); return; }
      const lines = inLines.value.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
      if (!lines.length) { err.textContent = 'Paste at least one line.'; inLines.focus(); return; }
      const canon = canonicalPedal(pedal), added = [];
      for (let i = 0; i < lines.length; i++) {
        const parts = lines[i].split(/\s*\|\s*|\t/);
        const name = clean(parts[0], 120), linkRaw = (parts[1] || '').trim(), slot = parts[2] || '', demoRaw = (parts[3] || '').trim();
        if (!name || /^https?:\/\//i.test(name)) { err.textContent = 'Line ' + (i + 1) + ' needs a preset name before the link.'; return; }
        const link = safeLink(linkRaw);
        if (linkRaw && !link) { err.textContent = 'Line ' + (i + 1) + ': the Drive link must start with https://'; return; }
        const demo = safeYouTube(demoRaw);
        if (demoRaw && !demo) { err.textContent = 'Line ' + (i + 1) + ': the demo must be a YouTube link starting with https://'; return; }
        added.push(normPreset({ id: uid(), name, pedal: canon, slot, category: inCat.value, notes: '', link, demo, added: today() }));
      }
      persist(mk({ presets: added.concat(state.presets) }), plural(added.length, 'preset') + ' added. The page is reloading.');
    } },
      h('div', { class: 'full' }, h('h2', { text: 'Bulk add' })),
      field('Pedal', '(applies to every line)', inPedal),
      field('Sound type', '(applies to every line)', inCat),
      field('One preset per line', '(name | Drive link | slot | YouTube demo, the last two are optional)', inLines, true),
      pedalOptions(),
      h('div', { class: 'full' }, err),
      actionsRow('Add presets'));
    setTimeout(() => { try { inPedal.focus(); } catch (e) {} }, 0);
    return form;
  }

  function formPedal() {
    const entry = ui.editor.key ? pedalByKey(ui.editor.key) : null;
    const inName = h('input', { id: 'e-name', type: 'text', maxlength: '60', autocomplete: 'off' });
    const inBrand = h('input', { id: 'e-brand', type: 'text', maxlength: '60', autocomplete: 'off', placeholder: 'Line 6, Boss, Zoom' });
    const inFolder = h('input', { id: 'e-folder', type: 'text', inputmode: 'url', autocomplete: 'off', placeholder: 'https://drive.google.com/drive/folders/...' });
    const inAbout = h('textarea', { id: 'e-about', rows: '3', maxlength: '600' });
    if (entry) { inName.value = entry.name; inBrand.value = entry.brand; inFolder.value = entry.folder; inAbout.value = entry.about; }
    const err = h('p', { class: 'err', role: 'alert' });
    const form = h('form', { class: 'form', novalidate: true, onsubmit: (e) => {
      e.preventDefault();
      const name = clean(inName.value, 60).replace(/\s+/g, ' ');
      const folderRaw = inFolder.value.trim(), folder = safeLink(folderRaw);
      if (!name) { err.textContent = 'Give the pedal a name.'; inName.focus(); return; }
      const newKey = pedalKey(name);
      if (allPedals().some((x) => x.key === newKey && (!entry || x.key !== entry.key))) { err.textContent = 'A pedal with that name already exists.'; inName.focus(); return; }
      if (folderRaw && !folder) { err.textContent = 'The Drive folder link must start with https://'; inFolder.focus(); return; }
      const profile = normPedal({ name, brand: inBrand.value, about: inAbout.value, folder });
      const oldKey = entry ? entry.key : newKey;
      const pedals = state.pedals.filter((p) => pedalKey(p.name) !== oldKey).concat([profile]);
      const presets = entry && entry.key !== newKey ? state.presets.map((p) => (pedalKey(p.pedal) === entry.key ? Object.assign({}, p, { pedal: name }) : p)) : state.presets;
      const next = mk({ presets, pedals });
      const slug = allPedals(next).find((x) => x.key === newKey).slug;
      persist(next, entry ? 'Pedal updated. The page is reloading.' : 'Pedal added. The page is reloading.', slug);
    } },
      h('div', { class: 'full' }, h('h2', { text: entry ? 'Edit pedal' : 'Add pedal' })),
      field('Pedal name', '(for example Line 6 HX Stomp)', inName),
      field('Brand', '(optional)', inBrand),
      field('Google Drive folder', '(optional, holds every preset for this pedal)', inFolder, true),
      field('About this pedal', '(optional)', inAbout, true),
      h('div', { class: 'full' }, err),
      actionsRow('Save pedal'));
    setTimeout(() => { try { inName.focus(); } catch (e) {} }, 0);
    return form;
  }

  function formAbout() {
    const inText = h('textarea', { id: 'a-text', rows: '9', maxlength: '1200' });
    inText.value = state.about || DEFAULT_ABOUT;
    const err = h('p', { class: 'err', role: 'alert' });
    const form = h('form', { class: 'form', novalidate: true, onsubmit: (e) => {
      e.preventDefault();
      persist(mk({ about: clean(inText.value, 1200) }), 'About text saved. The page is reloading.');
    } },
      h('div', { class: 'full' }, h('h2', { text: 'Edit about text' })),
      field('Text', '(leave a blank line between paragraphs)', inText, true),
      h('div', { class: 'full' }, err),
      actionsRow('Save text'));
    setTimeout(() => { try { inText.focus(); } catch (e) {} }, 0);
    return form;
  }

  function renderEditor() {
    clear(elEditor);
    if (!ui.canEdit || !ui.editor) { elEditorWrap.hidden = true; return; }
    elEditorWrap.hidden = false;
    const t = ui.editor.type;
    elEditor.appendChild(t === 'preset' ? formPreset() : t === 'bulk' ? formBulk() : t === 'pedal' ? formPedal() : formAbout());
  }

  // ---------- render ----------
  function renderMain() {
    route = getRoute();
    clear(elMain);
    const page = route.name === 'home' ? pageHome()
      : route.name === 'pedals' ? pagePedals()
      : route.name === 'presets' ? pagePresets()
      : route.name === 'saved' ? pageSaved()
      : route.name === 'about' ? pageAbout()
      : pagePedal(route.entry);
    elMain.appendChild(page);
    renderNav();
  }
  function renderAll() {
    renderAdmin();
    renderEditor();
    renderMain();
    renderFoot();
  }

  renderAll();
  window.addEventListener('hashchange', () => {
    ui.q = pendingQ; pendingQ = ''; ui.pedal = ''; ui.cat = ''; ui.artist = ''; ui.demo = false; ui.confirmId = null; ui.confirmPedal = false; ui.editor = null;
    renderEditor();
    renderMain();
    window.scrollTo(0, 0);
  });

  const toTop = h('button', { type: 'button', class: 'to-top', hidden: true, 'aria-label': 'Back to top', text: '↑', onclick: () => window.scrollTo({ top: 0, behavior: 'smooth' }) });
  document.body.appendChild(toTop);
  window.addEventListener('scroll', () => { toTop.hidden = window.scrollY < 600; }, { passive: true });
  document.addEventListener('keydown', (e) => {
    if (e.key !== '/' || /INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || '')) return;
    const q = document.getElementById('q');
    if (q) { e.preventDefault(); q.focus(); }
  });

  // Editing tools appear only for people who can edit this page.
  cap('user').then((u) => {
    if (!u) return;
    return Promise.all([
      Promise.resolve(u.canEdit ? u.canEdit() : false).catch(() => false),
      Promise.resolve(u.isOwner ? u.isOwner() : false).catch(() => false)
    ]).then((r) => { if (r[0] || r[1]) { ui.canEdit = true; renderAll(); } });
  });
})();
</script></body></html>
